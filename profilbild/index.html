<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Dreher CNC – Instagram-Profilbild</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   Instagram-Profilbild · Dreher Präzisionsdrehteile GmbH
   1080×1080, Instagram beschneidet automatisch auf einen Kreis.
   Markenfarbe #00A294 – direkt aus der Original-Logodatei ausgelesen.
   Export: node render-profil.js
   ========================================================================== */
:root { --teal: #00a294; --teal-dark: #007e73; --anthrazit: #3d3d3d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #6b7472; font-family: "Inter", "Liberation Sans", Arial, sans-serif; padding: 40px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
figure { display: flex; flex-direction: column; gap: 10px; }
figcaption { color: #fff; font-size: 15px; font-weight: 800; }

.pb {
  position: relative; width: 1080px; height: 1080px;
  display: grid; place-items: center; overflow: hidden;
}
.pb--teal  { background: radial-gradient(120% 120% at 30% 20%, #00b3a3 0%, var(--teal) 55%, var(--teal-dark) 100%); }
.pb--weiss { background: #ffffff; }
.pb--dark  { background: radial-gradient(120% 120% at 30% 20%, #4a4a4a 0%, var(--anthrazit) 60%, #2b2b2b 100%); }

/* Feines Rillenmuster – erinnert an eine gedrehte Oberfläche, bleibt dezent */
.pb--teal::after, .pb--dark::after {
  content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 3px, transparent 3px 14px);
}
.mark { position: relative; z-index: 2; width: 540px; height: 540px; }
.mark--klein { width: 430px; height: 430px; }
.wort {
  position: relative; z-index: 2;
  font-size: 118px; font-weight: 900; letter-spacing: -.01em; line-height: 1;
  margin-top: 26px;
}
.stapel { display: flex; flex-direction: column; align-items: center; }

/* Kreisvorschau: so sieht Instagram es wirklich */
.vorschau { display: flex; gap: 18px; align-items: flex-end; }
.kreis { border-radius: 50%; overflow: hidden; background: #fff; }
.kreis img { display: block; width: 100%; height: 100%; }
.k150 { width: 150px; height: 150px; }
.k64  { width: 64px;  height: 64px; }
.k32  { width: 32px;  height: 32px; }
.vlabel { color: #fff; font-size: 12px; font-weight: 700; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<script>
/* Die Bildmarke, nachgezeichnet nach der Original-Logodatei:
   offener Kreis (das C) mit dem N darin – linker Stamm plus Diagonale. */
const MARK = (farbe, ghost) => `
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  ${ghost ? `<g opacity=".10" stroke="${farbe}" stroke-width="0.9" fill="none">
      <path d="M21.4 15.2V36.4"/><path d="M33.8 15.2V36.4"/><path d="M21.4 15.2 33.8 36.4"/>
    </g>` : ""}
  <path d="M38.17 35.89 A18.5 18.5 0 1 1 38.17 12.11"
        stroke="${farbe}" stroke-width="3.1" fill="none" stroke-linecap="butt"/>
  <path d="M15.6 17.8V37.2" stroke="${farbe}" stroke-width="3.1" fill="none" stroke-linecap="butt"/>
  <path d="M15.1 14.4 33.6 37.4" stroke="${farbe}" stroke-width="3.1" fill="none" stroke-linecap="butt"/>
</svg>`;

const VARIANTEN = [
  { id: "a-tuerkis",      flaeche: "pb--teal",  farbe: "#ffffff",   ghost: true,  titel: "A · Weiß auf Türkis (Empfehlung)" },
  { id: "b-weiss",        flaeche: "pb--weiss", farbe: "#00a294",   ghost: true,  titel: "B · Türkis auf Weiß (wie Original)" },
  { id: "c-anthrazit",    flaeche: "pb--dark",  farbe: "#00a294",   ghost: false, titel: "C · Türkis auf Anthrazit" },
  { id: "d-mit-wortmarke",flaeche: "pb--teal",  farbe: "#ffffff",   ghost: false, titel: "D · Mit Wortmarke", wort: true },
];

document.body.innerHTML = VARIANTEN.map((v) => `
  <figure>
    <figcaption>${v.titel}</figcaption>
    <div class="pb ${v.flaeche}" id="${v.id}">
      ${v.wort
        ? `<div class="stapel"><span class="mark mark--klein">${MARK(v.farbe, v.ghost)}</span>
             <span class="wort" style="color:${v.farbe}">DREHER</span></div>`
        : `<span class="mark">${MARK(v.farbe, v.ghost)}</span>`}
    </div>
  </figure>`).join("");
</script>
</body>
</html>
