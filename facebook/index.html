<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Dreher CNC – Facebook: Profil- und Titelbild</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   Facebook-Seite · Dreher Präzisionsdrehteile GmbH

   FORMATE
   Profilbild  1080×1080  – quadratisch hochladen, Facebook beschneidet auf Kreis
   Titelbild   1640×624   – doppelte Auflösung von 820×312, damit es auf
                            Retina-Displays scharf bleibt

   BESCHNITT – der eigentliche Knackpunkt beim Titelbild:
   · Desktop zeigt 820×312, das Profilbild überlappt unten LINKS
   · Handy zeigt 640×360, beschneidet also links und rechts je ~90 px (×2: 180),
     und das Profilbild überlappt unten MITTIG
   Deshalb liegt aller Text in der waagrechten Mitte und oberhalb des unteren
   Bandes. Die Hilfslinien dazu sind in vorschau.html sichtbar.
   ========================================================================== */
:root { --teal: #00a294; --teal-hell: #00b3a3; --teal-dark: #007e73; --anthrazit: #3d3d3d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #6b7472; font-family: "Inter", "Liberation Sans", Arial, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 34px; align-items: flex-start; }
figure { display: flex; flex-direction: column; gap: 10px; }
figcaption { color: #fff; font-size: 15px; font-weight: 800; }

/* ---------- Profilbild 1080×1080 ---------- */
.pb { position: relative; width: 1080px; height: 1080px; display: grid; place-items: center; overflow: hidden; }
.pb--teal   { background: radial-gradient(120% 120% at 30% 20%, var(--teal-hell) 0%, var(--teal) 55%, var(--teal-dark) 100%); }
.pb--rillen {
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.17) 0 3px, transparent 3px 20px),
    radial-gradient(120% 120% at 30% 20%, var(--teal-hell) 0%, var(--teal) 55%, var(--teal-dark) 100%);
}
.pb .mark { position: relative; z-index: 2; width: 820px; height: 820px; }

/* ---------- Titelbild 1640×624 ---------- */
.tb { position: relative; width: 1640px; height: 624px; overflow: hidden; color: #fff; isolation: isolate; }
.tb--foto   { background: var(--teal-dark); }
.tb--rillen {
  background:
    repeating-radial-gradient(circle at 22% 50%, rgba(255,255,255,.12) 0 3px, transparent 3px 26px),
    linear-gradient(105deg, var(--teal-hell) 0%, var(--teal) 52%, var(--teal-dark) 100%);
}
.tb .shot {
  position: absolute; inset: 0;
  background-image: url("../fotos/web/index-c200-team-hero.jpg");
  background-size: cover; background-position: 50% 38%;
  filter: grayscale(1) contrast(1.12) brightness(.72);
}
.tb .duo    { position: absolute; inset: 0; background: var(--teal); mix-blend-mode: color; opacity: .93; }
.tb .schleier {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(6,32,29,.88) 0%, rgba(6,32,29,.62) 42%, rgba(6,32,29,.38) 100%);
}
.tb .rillen-overlay { position: absolute; inset: 0; background-image: repeating-linear-gradient(112deg, rgba(255,255,255,.05) 0 3px, transparent 3px 15px); }

/* Textblock: waagrecht mittig (Handy schneidet außen ab),
   oben gehalten (unten überlappt das Profilbild)                            */
.tb__text {
  position: absolute; z-index: 3;
  left: 180px; right: 180px; top: 96px;
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.tb__klein {
  display: inline-flex; align-items: center; gap: 14px;
  font-size: 23px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
  color: #a9ece4; margin-bottom: 22px;
}
.tb__klein::before, .tb__klein::after { content: ""; width: 44px; height: 3px; background: currentColor; border-radius: 2px; opacity: .7; }
.tb__claim { font-size: 74px; font-weight: 900; letter-spacing: -.03em; line-height: 1.02; }
.tb__claim em { font-style: normal; color: #6fe4d6; }
.tb__leistung { margin-top: 20px; font-size: 29px; font-weight: 600; color: #dcf5f1; }
.tb__url { margin-top: 26px; font-size: 24px; font-weight: 800; letter-spacing: .06em; color: rgba(255,255,255,.72); }
</style>
</head>
<body>
<script>
const MARK = (farbe, staerke = 2.9) => `
<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M38.17 35.89 A18.5 18.5 0 1 1 38.17 12.11" stroke="${farbe}" stroke-width="${staerke}" fill="none" stroke-linecap="butt"/>
  <path d="M15.6 17.8V37.2" stroke="${farbe}" stroke-width="${staerke}" fill="none" stroke-linecap="butt"/>
  <path d="M15.1 14.4 33.6 37.4" stroke="${farbe}" stroke-width="${staerke}" fill="none" stroke-linecap="butt"/>
</svg>`;

const TITEL = (v) => `
  ${v.foto ? '<div class="shot"></div><div class="duo"></div><div class="schleier"></div>' : ""}
  <div class="rillen-overlay"></div>
  <div class="tb__text">
    <span class="tb__klein">Präzisionsdrehteile</span>
    <div class="tb__claim">${v.claim}</div>
    <div class="tb__leistung">${v.leistung}</div>
    <div class="tb__url">dreher-cnc.de</div>
  </div>`;

const SETS = [
  {
    id: "werkstatt",
    titel: "Set 1 · Werkstatt (Foto)",
    profil: { flaeche: "pb--teal" },
    cover:  { flaeche: "tb--foto", foto: true,
              claim: 'CNC-Dreh- &amp; Frästeile<br>aus <em>Balgheim</em>',
              leistung: "Komplexe Teile statt Massenware · Made in Germany" },
  },
  {
    id: "drehrillen",
    titel: "Set 2 · Drehrillen (grafisch)",
    profil: { flaeche: "pb--rillen" },
    cover:  { flaeche: "tb--rillen", foto: false,
              claim: 'Präzision, die man<br><em>messen</em> kann.',
              leistung: "CNC-Drehen · Fräsen · Veredelung · Balgheim" },
  },
];

document.body.innerHTML = SETS.map((s) => `
  <figure>
    <figcaption>${s.titel} – Profilbild 1080×1080</figcaption>
    <div class="pb ${s.profil.flaeche}" id="profil-${s.id}"><span class="mark">${MARK("#ffffff")}</span></div>
  </figure>
  <figure>
    <figcaption>${s.titel} – Titelbild 1640×624</figcaption>
    <div class="tb ${s.cover.flaeche}" id="titel-${s.id}">${TITEL(s.cover)}</div>
  </figure>`).join("");
</script>
</body>
</html>
